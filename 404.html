<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Chami</title>
<link rel="icon" href="/images/favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--c3); outline-offset: 2px; }
  :root {
    --bg: #fafaf8;
    --fg: #111;
    --c2: #0066ff;
    --c3: #ffb800;
    --line: #e0dcd5;
    --muted: #666;
  }
  html.dark {
    --bg: #1a1a1c;
    --fg: #e8e6e3;
    --line: #2e2e30;
    --muted: #999;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; font-family: 'Inter', 'Noto Sans SC', sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { text-align: center; padding: 48px 24px; }
  h1 { font-size: 72px; font-weight: 800; color: color-mix(in srgb, var(--fg) 18%, var(--bg)); margin-bottom: 8px; }
  p { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
  a { color: var(--c2); text-decoration: none; font-size: 15px; }
  a:hover { text-decoration: underline; }
  .theme-btn {
    position: fixed; top: 16px; right: 16px;
    width: 44px; height: 44px;
    background: none; border: 1px solid var(--line); border-radius: 50%;
    font-size: 18px; cursor: pointer; color: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .theme-btn:hover { background: var(--line); }
  html.dark .theme-btn { border-color: #666; color: #ffd43b; }
</style>
<script>
  var _saved = localStorage.getItem('theme');
  if (_saved === 'dark' || ((_saved === 'system' || !_saved) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
</script>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" title="切换主题" id="theme-btn">🌙</button>
<div class="wrap">
  <h1>404</h1>
  <p>这个页面不存在，或者已经被删除了。</p>
  <a href="/index.html">← 回到首页</a>
</div>
<script defer src="/assets/js/theme.js"></script>
</body>
</html>
