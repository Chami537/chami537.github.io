<style>
{% include 'includes/base.css' %}
:root {
  --archive-muted: #666;
  --archive-accent-text: #765500;
}
html.dark {
  --archive-muted: #aaa;
  --archive-accent-text: #ffc642;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.archive-wrap {
  max-width: 680px; margin: 0 auto; padding: 120px 48px 100px;
}
.archive-header {
  margin-bottom: 48px;
}
.archive-header h1 {
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  font-size: clamp(40px, 7vw, 64px);
  font-weight: 900; line-height: 1.0;
  letter-spacing: -0.025em; margin-bottom: 12px;
}
.archive-header .sub {
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  font-size: 15px; color: var(--archive-muted);
}

/* Tag filter chips */
.essay-filter {
  display: flex; flex-wrap: wrap; gap: 0 28px;
  margin-bottom: 28px; border-bottom: 1px solid var(--line);
}
.ef-chip {
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  display: inline-flex; align-items: center; min-height: 36px;
  padding: 0 0 9px; border: 0; border-bottom: 2px solid transparent;
  border-radius: 0; background: transparent; color: var(--archive-muted);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: color .16s ease, border-color .16s ease; user-select: none;
  appearance: none;
}
.ef-chip:hover { color: var(--fg); }
.ef-chip.active { color: var(--fg); border-bottom-color: var(--c3); }

/* Search */
.essay-search {
  margin-bottom: 12px; position: relative;
}
.essay-search input {
  width: 100%; min-height: 42px; padding: 8px 14px 8px 36px;
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  font-size: 14px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; outline: none;
  transition: border-color .2s;
}
.essay-search input:focus { border-color: var(--c3); }
.essay-search input::placeholder { color: var(--archive-muted); }
.essay-search::before {
  content: "🔍"; position: absolute;
  left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 13px; pointer-events: none;
}

.archive-year { margin-bottom: 40px; }
.archive-year-heading {
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  font-size: 28px; font-weight: 800; color: var(--archive-accent-text);
  border-left: 3px solid var(--c3); padding-left: 14px;
  margin-bottom: 20px;
}
.archive-row {
  display: grid; grid-template-columns: 72px minmax(0, 1fr) auto;
  align-items: baseline; column-gap: 16px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
  text-decoration: none; color: var(--fg);
  transition: padding-left .3s, background .3s;
}
.archive-row:hover {
  padding-left: 24px; background: rgba(255,184,0,0.05);
}
.archive-date {
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  font-size: 12px; color: var(--archive-muted);
}
.archive-title {
  font-family: 'Lora', 'LXGW WenKai Lite', 'Noto Sans SC', serif;
  font-size: 17px; font-weight: 600; min-width: 0; overflow-wrap: anywhere;
}
.archive-lock { font-size: 12px; margin-left: 6px; }
.archive-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--archive-accent-text);
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
}

/* Back link */
.back-link {
  font-family: 'Lora', 'Inter', 'Noto Serif SC', serif;
  font-size: 13px; font-weight: 600; color: var(--archive-muted);
  text-decoration: none; display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-top: 48px; transition: color .2s;
}
.back-link:hover { color: var(--c3); }
.back-link .arr { transition: transform .2s; display: inline-block; }
.back-link:hover .arr { transform: translateX(-4px); }
@media (max-width: 768px) {
  nav { padding: 0 16px; }
  .archive-wrap { padding: 100px 24px 80px; }
  .archive-row { grid-template-columns: 56px minmax(0, 1fr); column-gap: 10px; row-gap: 5px; }
  .archive-date { font-size: 11px; }
  .archive-tag { grid-column: 2; font-size: 9px; }
  .ef-chip { font-size: 12px; }
  .essay-search input { font-size: 16px; }
}
</style>

<script>
  var _saved = localStorage.getItem('theme');
  if (_saved === 'dark' || ((_saved === 'system' || !_saved) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }

<body>

{% raw %}

<main class="archive-wrap">
  <div class="archive-header">
    <h1>Archive</h1>
    <p class="sub">共 {% endraw %}{{ total }}{% raw %} 篇随笔</p>
  </div>

  <div class="essay-search">
    <label class="sr-only" for="archive-search">搜索随笔</label>
    <input type="search" id="archive-search" placeholder="搜索随笔..." oninput="onArchiveSearch(this.value)">

    <span class="arr">←</span>
    <span>返回主页</span>
  </a>
</main>

{% endraw %}
{% include 'includes/footer.html' %}
{% raw %}

<script>
var _archiveEssays = {% endraw %}{{ essays_json }}{% raw %};
var _archiveFilter = '';
var _archiveSearch = '';
var _archiveSearchTimer = null;

// Theme init
</script>
{% endraw %}
<script src="/assets/js/theme.js?v={{ build_ts }}"></script>
{% raw %}
<script>

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function monthDay(dateStr) {
  try {
    var dp = (dateStr.indexOf(' ') !== -1 ? dateStr.split(' ')[0] : dateStr).split('-');
    if (dp.length >= 3 && dp[2]) {
      var mi = +dp[1] - 1;
      if (mi >= 0 && mi < 12) return MONTHS[mi] + ' ' + (+dp[2]);
    }
  } catch(e) {}
  return '';
}

function renderArchiveEntries(data) {
  // Group by year
  var years = {};
  data.forEach(function(e) {
    var dateStr = e.date || '';
    var year = dateStr.length >= 4 ? dateStr.slice(0, 4) : 'Unknown';
    if (!years[year]) years[year] = [];
    years[year].push(e);
  });

  var yearKeys = Object.keys(years).sort().reverse();
  var html = '';
  yearKeys.forEach(function(year) {
    html += '<div class="archive-year"><h2 class="archive-year-heading">' + year + '</h2>';
    years[year].forEach(function(e) {
      var slug = e.slug.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var title = e.title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var tag = (e.tag || '').replace(/, ?/g, ' · ').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var md = monthDay(e.date);
      html += '<a href="essays/' + slug + '.html" class="archive-row">' +
        '<span class="archive-date">' + md + '</span>' +
        '<span class="archive-title">' + title + (e.password_protected ? ' <span class="archive-lock" title="需要密码">🔒</span>' : '') + '</span>' +
        '<span class="archive-tag">' + tag + '</span>' +
        '</a>';
    });
    html += '</div>';
  });

  var container = document.getElementById('archive-entries');
  if (html) {
    container.innerHTML = html;
  } else {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:60px 0;">没有匹配的随笔</p>';
  }
}

function buildTagFilter() {
  var tags = new Set();
  _archiveEssays.forEach(function(e) {
    (e.tag || '').split(/[,，]/).forEach(function(t) { t = t.trim(); if (t) tags.add(t); });
  });
  var html = '<button type="button" class="ef-chip' + (!_archiveFilter ? ' active' : '') + '" aria-pressed="' + (!_archiveFilter) + '" onclick="filterArchiveByTag(\'\')">全部</button>';
  tags.forEach(function(t) {
    html += '<button type="button" class="ef-chip' + (_archiveFilter === t ? ' active' : '') + '" aria-pressed="' + (_archiveFilter === t) + '" data-tag="' + t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '" onclick="filterArchiveByTag(this.getAttribute(\'data-tag\'))">' + t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</button>';
  });
  document.getElementById('archive-tag-filter').innerHTML = html;
}

function filterArchiveByTag(tag) {
  _archiveFilter = tag;
  buildTagFilter();
  applyFilters();
}

function onArchiveSearch(query) {
  clearTimeout(_archiveSearchTimer);
  _archiveSearch = query.toLowerCase().trim();
  _archiveSearchTimer = setTimeout(function() {
    applyFilters();
  }, 100);
}

function applyFilters() {
  var filtered = _archiveEssays;
  if (_archiveFilter) {
    filtered = filtered.filter(function(e) {
      return (e.tag || '').split(/[,，]/).some(function(t) { return t.trim() === _archiveFilter; });
    });
  }
  if (_archiveSearch) {
    filtered = filtered.filter(function(e) {
      return (e.title || '').toLowerCase().indexOf(_archiveSearch) !== -1 ||
             (e.excerpt || '').toLowerCase().indexOf(_archiveSearch) !== -1;
    });
  }
  renderArchiveEntries(filtered);
}

// Initial render
buildTagFilter();
renderArchiveEntries(_archiveEssays);

// Render friends
(function() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/data/friends.json?v={% endraw %}{{ build_ts }}{% raw %}', true);
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) return;
      var friends = JSON.parse(xhr.responseText);
      var container = document.getElementById('friends-container');
      var html = '<div class="friends-label">FRIEND</div>';
      friends.forEach(function(f) {
        var escUrl = f.url.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var escName = f.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        if (/^https?:\/\//i.test(f.url)) {
          html += '<a href="' + escUrl + '">' + escName + '</a>';
        } else {
          html += '<span>' + escName + '</span>';
        }
      });
      container.innerHTML = html;
    };
    xhr.send();
  } catch(e) {}
})();
</script>

</body>
</html>{% endraw %}
